# Runs quality checks (linting, tests, etc.), updates the release PR / publishes packages.
# Also builds the sample site + api docs (in the main branch) and publishes them to github pages.
name: CI
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "Test and Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install
        uses: open-pioneer/trails-repo-automation/.github/actions/install@main

      - name: Run checks
        run: |
          pnpm run ci:test

  release:
    name: "Publish or create version PR"
    if: github.ref == 'refs/heads/main'
    needs:
      - test
    uses: open-pioneer/trails-repo-automation/.github/workflows/shared-release.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
